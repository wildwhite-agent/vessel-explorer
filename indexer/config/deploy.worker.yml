service: vessel-indexer-worker

image: <%= ENV["DOCKER_REGISTRY_USERNAME"] %>/vessel-indexer

primary_role: worker

servers:
  worker:
    hosts:
      - <%= ENV["DEPLOY_HOST"] %>
    proxy: false
    options:
      network: vessel-data
      memory: 3g
      memory-swap: 3g
      cpus: 2
      pids-limit: 128
      cap-drop: ALL
      security-opt: no-new-privileges:true

deploy_timeout: 3600

labels:
  vvork.project: vessel-explorer
  vvork.kind: worker
  vvork.owner: ygg
  vvork.repo: https://github.com/wildwhite-agent/vessel-explorer

registry:
  username: <%= ENV["DOCKER_REGISTRY_USERNAME"] %>
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  context: ..
  dockerfile: ../Dockerfile.indexer

env:
  clear:
    VESSEL_PROCESS: indexer
    PONDER_TELEMETRY_DISABLED: 'true'
    NODE_OPTIONS: '--max-old-space-size=2048 --max-http-header-size=8192'
    PONDER_RPC_REQUESTS_PER_SECOND_1: '<%= ENV["PONDER_RPC_REQUESTS_PER_SECOND_1"] || "10" %>'
    PONDER_ETH_GET_LOGS_BLOCK_RANGE_1: '<%= ENV["PONDER_ETH_GET_LOGS_BLOCK_RANGE_1"] || "5000" %>'
    VESSEL_INDEXER_START_BLOCK: '<%= ENV["VESSEL_INDEXER_START_BLOCK"] || "" %>'
    VESSEL_INDEXER_END_BLOCK: '<%= ENV["VESSEL_INDEXER_END_BLOCK"] || "" %>'
    WORK_UNIT_INDEXER_START_BLOCK: '<%= ENV["WORK_UNIT_INDEXER_START_BLOCK"] || "" %>'
    WORK_UNIT_INDEXER_END_BLOCK: '<%= ENV["WORK_UNIT_INDEXER_END_BLOCK"] || "" %>'
    SEQUENCE_INDEXER_START_BLOCK: '<%= ENV["SEQUENCE_INDEXER_START_BLOCK"] || "" %>'
    SEQUENCE_INDEXER_END_BLOCK: '<%= ENV["SEQUENCE_INDEXER_END_BLOCK"] || "" %>'
    SEQUENCE_METADATA_REFRESH_INTERVAL_BLOCKS: '<%= ENV["SEQUENCE_METADATA_REFRESH_INTERVAL_BLOCKS"] || "300" %>'
    SEQUENCE_TOKEN_SCAN_MAX_ID: '<%= ENV["SEQUENCE_TOKEN_SCAN_MAX_ID"] || "512" %>'
    SEQUENCE_TOKEN_SCAN_EMPTY_GAP: '<%= ENV["SEQUENCE_TOKEN_SCAN_EMPTY_GAP"] || "16" %>'
  secret:
    - PONDER_RPC_URLS_1
    - PONDER_RPC_FALLBACK_URLS_1
    - PONDER_WS_URL_1
    - DATABASE_URL:INDEXER_DATABASE_URL
    - DATABASE_SCHEMA
    - PONDER_VIEWS_SCHEMA

ssh:
  user: deploy
