<%
indexer_hosts = [ENV["INDEXER_HOST"]]
  .concat((ENV["INDEXER_ADDITIONAL_HOSTS"] || "").split(","))
  .map(&:strip)
  .reject(&:empty?)
  .uniq
%>

service: vessel-indexer

image: <%= ENV["DOCKER_REGISTRY_USERNAME"] %>/vessel-indexer

servers:
  web:
    hosts:
      - <%= ENV["DEPLOY_HOST"] %>
    options:
      network: vessel-data
      memory: 1g
      memory-swap: 1g
      cpus: 1
      pids-limit: 128
      cap-drop: ALL
      security-opt: no-new-privileges:true

labels:
  vvork.project: vessel-explorer
  vvork.kind: app
  vvork.owner: personal
  vvork.url: 'https://<%= ENV["INDEXER_HOST"] %>'
  vvork.repo: https://github.com/wildwhite-agent/vessel-explorer

proxy:
  ssl: true
  hosts:
<% indexer_hosts.each do |host| %>
    - <%= host %>
<% end %>
  app_port: 42069
  healthcheck:
    path: /ready
    interval: 5
    timeout: 3600

deploy_timeout: 3600

registry:
  username: <%= ENV["DOCKER_REGISTRY_USERNAME"] %>
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  context: ..
  dockerfile: ../Dockerfile.indexer

env:
  clear:
    VESSEL_PROCESS: api
    PONDER_TELEMETRY_DISABLED: 'true'
    NODE_OPTIONS: '--max-old-space-size=640 --max-http-header-size=8192'
    PONDER_RPC_REQUESTS_PER_SECOND_1: '<%= ENV["PONDER_RPC_REQUESTS_PER_SECOND_1"] || "10" %>'
    PONDER_ETH_GET_LOGS_BLOCK_RANGE_1: '<%= ENV["PONDER_ETH_GET_LOGS_BLOCK_RANGE_1"] || "5000" %>'
    VESSEL_INDEXER_START_BLOCK: '<%= ENV["VESSEL_INDEXER_START_BLOCK"] || "" %>'
    VESSEL_INDEXER_END_BLOCK: '<%= ENV["VESSEL_INDEXER_END_BLOCK"] || "" %>'
    WORK_UNIT_INDEXER_START_BLOCK: '<%= ENV["WORK_UNIT_INDEXER_START_BLOCK"] || "" %>'
    WORK_UNIT_INDEXER_END_BLOCK: '<%= ENV["WORK_UNIT_INDEXER_END_BLOCK"] || "" %>'
    SEQUENCE_INDEXER_START_BLOCK: '<%= ENV["SEQUENCE_INDEXER_START_BLOCK"] || "" %>'
    SEQUENCE_INDEXER_END_BLOCK: '<%= ENV["SEQUENCE_INDEXER_END_BLOCK"] || "" %>'
    SEQUENCE_METADATA_REFRESH_INTERVAL_BLOCKS: '<%= ENV["SEQUENCE_METADATA_REFRESH_INTERVAL_BLOCKS"] || "300" %>'
    SEQUENCE_TOKEN_SCAN_MAX_ID: '<%= ENV["SEQUENCE_TOKEN_SCAN_MAX_ID"] || "512" %>'
    SEQUENCE_TOKEN_SCAN_EMPTY_GAP: '<%= ENV["SEQUENCE_TOKEN_SCAN_EMPTY_GAP"] || "16" %>'
  secret:
    - DATABASE_URL:API_DATABASE_URL
    - PONDER_VIEWS_SCHEMA

accessories:
  db:
    image: postgres:17.11-alpine
    host: <%= ENV["DEPLOY_HOST"] %>
    port: '127.0.0.1:5470:5432'
    network: vessel-data
    options:
      memory: 4g
      memory-swap: 4g
      cpus: 2
      pids-limit: 256
      security-opt: no-new-privileges:true
    labels:
      vvork.project: vessel-explorer
      vvork.kind: db
      vvork.owner: personal
      vvork.url: 'https://<%= ENV["INDEXER_HOST"] %>'
      vvork.repo: https://github.com/wildwhite-agent/vessel-explorer
    env:
      clear:
        POSTGRES_DB: vessel
        POSTGRES_USER: vessel
      secret:
        - POSTGRES_PASSWORD
    cmd: postgres -c shared_buffers=512MB -c max_connections=80 -c work_mem=16MB -c temp_file_limit=512MB
    directories:
      - /home/deploy/vessel-indexer-db/data:/var/lib/postgresql/data

ssh:
  user: deploy
