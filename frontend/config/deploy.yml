<%
artwork_host = ENV.fetch("ARTWORK_HOST")
raise "ARTWORK_HOST must be a separate DNS hostname" unless artwork_host.match?(/\A[a-z0-9.-]+\z/) && artwork_host.include?(".") && artwork_host != ENV["APP_HOST"]
%>

service: vessel-explorer

image: <%= ENV["DOCKER_REGISTRY_USERNAME"] %>/vessel-explorer

servers:
  web:
    hosts:
      - <%= ENV["DEPLOY_HOST"] %>
    options:
      memory: 1g
      memory-swap: 1g
      cpus: 1
      pids-limit: 128
      cap-drop: ALL
      security-opt: no-new-privileges:true

labels:
  vvork.project: vessel-explorer
  vvork.kind: app
  vvork.owner: personal
  vvork.url: 'https://<%= ENV["APP_HOST"] %>'
  vvork.repo: https://github.com/wildwhite-agent/vessel-explorer

proxy:
  ssl: true
  hosts:
    - <%= ENV["APP_HOST"] %>
    - <%= artwork_host %>
  app_port: 3000
  healthcheck:
    path: /
    interval: 5
    timeout: 60

registry:
  username: <%= ENV["DOCKER_REGISTRY_USERNAME"] %>
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  context: ..
  dockerfile: ../Dockerfile.frontend

env:
  clear:
    NITRO_CLUSTER_WORKERS: '1'
    NODE_OPTIONS: '--max-old-space-size=640 --max-http-header-size=8192'
    NUXT_PUBLIC_ARTWORK_ORIGIN: '<%= "https://#{artwork_host}" %>'
    SEQUENCE_ASSET_HOSTS: '<%= ENV["SEQUENCE_ASSET_HOSTS"] || "" %>'
    NUXT_INDEXER_URL: '<%= ENV["NUXT_INDEXER_URL"] || "" %>'
    NUXT_PUBLIC_MACHINE_RPC_URL: '<%= ENV["NUXT_PUBLIC_MACHINE_RPC_URL"] || "" %>'
    NUXT_PUBLIC_EVM_CHAINS_MAINNET_RPCS: '<%= ENV["NUXT_PUBLIC_EVM_CHAINS_MAINNET_RPCS"] || ENV["NUXT_PUBLIC_MACHINE_RPC_URL"] || "https://ethereum-rpc.publicnode.com" %>'

ssh:
  user: deploy
